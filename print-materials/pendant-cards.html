<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Righteous&family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --hot-pink:#FF2D78; --electric:#00D4FF; --lime:#A8FF3E;
    --orange:#FF6B1A; --purple:#BF5AF2; --yellow:#FFE600;
  }
  html,body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  /* 3 x 4.5in card + 0.125in bleed = 3.25 x 4.75in. Chain slits pre-cut ~1/3 down. */
  @page { size:3.25in 4.75in; margin:0; }

  .card{
    position:relative; width:3.25in; height:4.75in; overflow:hidden;
    background:#fdf5ff; color:#3a1f45; font-family:'Nunito',sans-serif; text-align:center;
  }
  /* soft pastel wash matching the earring cards: small pink top-left, blue swept across */
  .glow{ position:absolute; inset:0; z-index:0;
    background:
      radial-gradient(circle at 6% 4%,   rgba(255,45,120,.17), transparent 22%),
      radial-gradient(circle at 72% 20%,  rgba(0,212,255,.24), transparent 52%),
      radial-gradient(circle at 20% 62%,  rgba(0,212,255,.15), transparent 46%),
      radial-gradient(circle at 88% 82%,  rgba(191,90,242,.15), transparent 44%),
      radial-gradient(circle at 90% 46%,  rgba(168,255,62,.11), transparent 40%);
  }

  /* branding sits ABOVE the chain slits (top third) */
  .top{ position:absolute; z-index:3; top:.45in; left:0; right:0; }
  .wordmark{
    font-family:'Bagel Fat One',cursive; font-size:28pt; line-height:.95;
    background:linear-gradient(92deg,#FF2D78 5%,#FFE600 34%,#A8FF3E 55%,#00D4FF 78%,#BF5AF2 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.30));
  }
  .tagline{
    font-family:'Righteous',sans-serif; color:#c0348a; letter-spacing:.13em;
    text-transform:uppercase; font-size:9.5pt; margin-top:7pt;
  }

  .bottom{ position:absolute; z-index:3; bottom:.36in; left:0; right:0;
    font-family:'Righteous',sans-serif; font-size:8.5pt; color:#5a2f5a; letter-spacing:.03em; }
  .bottom .dot{ color:var(--hot-pink); padding:0 5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <div class="top">
      <div class="wordmark">We're Cured!</div>
      <div class="tagline">Handmade Resin Art</div>
    </div>
    <div class="bottom">
      @were_cured <span class="dot">✦</span> werecured.ca
    </div>
  </div>
</body>
</html>
