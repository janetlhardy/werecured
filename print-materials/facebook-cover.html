<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<title>We're Cured! Facebook Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Righteous&display=swap" rel="stylesheet">
<style>
  /* Facebook cover photo, 1640 x 624 px (twice Facebook's 820 x 312, so it stays sharp).
     It's the booth banner, re-proportioned. Phones show only the middle two-thirds of a cover
     and crop the sides, so all the lettering sits inside the centre 1000 px. */
  :root{ --dark:#1A001F; --lime:#A8FF3E; --hot-pink:#FF2D78; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1640px; height:624px; overflow:hidden; background:var(--dark); }

  .cover{
    position:relative; width:1640px; height:624px; overflow:hidden; background:var(--dark);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  /* same background, brightness and scrim as booth-banner.html */
  .photo{
    position:absolute; inset:0; z-index:0;
    background:url('../images/banner-background.jpeg') center/cover no-repeat;
    filter:brightness(1.16) saturate(1.20) contrast(1.02);
  }
  .veil{
    position:absolute; inset:0; z-index:1;
    background:
      radial-gradient(ellipse 46% 80% at 50% 50%,
        rgba(26,0,31,.55) 0%, rgba(26,0,31,.28) 58%, rgba(26,0,31,.02) 88%),
      linear-gradient(90deg, rgba(26,0,31,.26) 0%, rgba(26,0,31,0) 30%,
        rgba(26,0,31,0) 70%, rgba(26,0,31,.26) 100%);
  }
  .inner{ position:relative; z-index:2; }

  /* gradient clipped to text needs inline-block, or it only picks up the middle */
  .wordmark{
    font-family:'Bagel Fat One',cursive; font-size:150px; line-height:.9; white-space:nowrap;
    display:inline-block;
    background:linear-gradient(92deg,#FF2D78 5%,#FFE600 35%,#A8FF3E 55%,#00D4FF 78%,#BF5AF2 100%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.95)) drop-shadow(0 8px 26px rgba(0,0,0,.7));
  }
  .tagline{
    font-family:'Righteous',cursive; color:var(--lime); font-size:40px;
    letter-spacing:.14em; text-transform:uppercase; margin-top:14px; white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,.95), 0 4px 14px rgba(0,0,0,.75);
  }
  .contact{
    font-family:'Righteous',cursive; color:#fff; font-size:35px; letter-spacing:.04em;
    margin-top:14px; white-space:nowrap;
    text-shadow:0 2px 4px rgba(0,0,0,.95), 0 4px 14px rgba(0,0,0,.75);
  }
  .contact .dot{ color:var(--hot-pink); padding:0 .5em; }
</style>
</head>
<body>
<div class="cover">
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="inner">
    <div class="wordmark">We're Cured!</div>
    <div class="tagline">Handmade Resin Art</div>
    <div class="contact">werecured.ca<span class="dot">&bull;</span>@were_cured</div>
  </div>
</div>
</body>
</html>
